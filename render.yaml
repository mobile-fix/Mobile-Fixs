# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — MyMobiFix
#
# Defines the whole stack (web service + PostgreSQL) declaratively, so the
# deployment is reproducible and reviewable rather than a sequence of dashboard
# clicks. Point Render at this repo via "New → Blueprint".
#
# Free-tier caveats, stated plainly:
#   - A free web service spins down after ~15 minutes idle; the next request
#     takes 30–60s to wake it. Upgrade to Starter for an always-on service.
#   - A free PostgreSQL instance is deleted after 30 days. Move to a paid plan
#     before taking real bookings, or you will lose the database.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: mymobifix-db
    databaseName: mymobifix
    plan: free
    region: singapore # closest region to an India-facing business
    postgresMajorVersion: "16"

services:
  - type: web
    name: mymobifix
    runtime: node
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /

    # Migrations run in the build step: on the free plan there is no separate
    # pre-deploy hook, and the schema must exist before the server accepts
    # traffic. `migrate deploy` only applies committed migrations — it never
    # generates or resets anything.
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mymobifix-db
          property: connectionString

      # Generated once by Render and never shown in the repo.
      - key: SESSION_SECRET
        generateValue: true

      - key: NODE_VERSION
        value: "20"

      # Next.js inlines NEXT_PUBLIC_* at build time, so these must be present
      # during the build, not just at runtime.
      # Replace with the custom domain once DNS is verified — it backs canonical
      # URLs, the sitemap and the CSRF origin check.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mymobifix.onrender.com

      - key: NEXT_PUBLIC_BRAND_NAME
        value: MyMobiFix

      # Real business details — set these in the dashboard before going live.
      - key: NEXT_PUBLIC_SUPPORT_PHONE
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: NEXT_PUBLIC_BUSINESS_HOURS
        sync: false
      - key: NEXT_PUBLIC_BUSINESS_ADDRESS
        sync: false

      # Owner account created by `npm run db:seed`. Set a strong password in the
      # dashboard; it is deliberately not stored here.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
